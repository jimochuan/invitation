<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 回应列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#fce4ec,#fdf6f0,#f3e5f5);min-height:100vh;padding:20px}
.wrap{max-width:500px;margin:0 auto}
h1{text-align:center;color:#c97d93;margin:16px 0;letter-spacing:2px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative}
.card .no{font-size:12px;color:#999;margin-bottom:6px}
.card .detail{font-size:15px;line-height:2;color:#4a3548}
.card .msg{margin-top:10px;padding:12px 16px;background:#fef5f7;border-radius:12px;color:#7a6578;font-size:14px;line-height:1.6}
.card .del-btn{position:absolute;top:12px;right:12px;width:32px;height:32px;border:none;border-radius:50%;background:#fee;color:#d47878;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.card .del-btn:hover{background:#fdd;transform:scale(1.1)}
.empty{text-align:center;color:#999;padding:40px;font-size:14px}
.refresh{text-align:center;margin:16px 0}
.refresh button{padding:10px 28px;border:none;border-radius:50px;background:linear-gradient(135deg,#e8a0b4,#c97d93);color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;font-family:inherit}
.loading{text-align:center;color:#999;padding:40px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 收到的回应</h1>
  <div id="gate">
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:15px;color:#7a6578;margin-bottom:16px;">🔐 输入暗号查看回应</div>
      <input type="password" id="adminCode" placeholder="输入暗号..." style="padding:12px 16px;border:2px solid #e8d5d5;border-radius:50px;font-size:15px;width:80%;max-width:280px;outline:none;text-align:center;font-family:inherit;letter-spacing:3px;" oninput="document.getElementById('gateBtn').disabled=this.value.trim()===''">
      <br><br>
      <button id="gateBtn" onclick="verifyAdmin()" disabled style="padding:10px 32px;border:none;border-radius:50px;background:linear-gradient(135deg,#e8a0b4,#c97d93);color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px;font-family:inherit;">🔓 查看</button>
      <div id="gateErr" style="color:#d47878;font-size:13px;margin-top:12px;display:none;">暗号不对哦</div>
    </div>
  </div>
  <div id="content" style="display:none;">
    <div class="refresh"><button onclick="load()">🔄 刷新</button></div>
    <div id="list"><div class="loading">加载中...</div></div>
  </div>
</div>
<script>
var URL = 'https://iqawreswebkaurbswkpf.supabase.co/rest/v1/responses';
var KEY = 'sb_publishable_s3ZAvkd9G6xSJDhFhlFS-g_2DWMsI1O';

// ★★★ 设置暗号：改成和邀请页一样的暗号 ★★★
var ADMIN_CODE = '我们的暗号';

function timeAgo(d){
  var now = new Date(); var t = new Date(d); var diff = Math.floor((now - t) / 1000);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  return Math.floor(diff/86400) + ' 天前';
}

function delRow(id){
  if (!confirm('确定删除这条记录？')) return;
  fetch(URL + '?id=eq.' + id, {
    method: 'DELETE',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  }).then(function(){ load(); });
}

function verifyAdmin(){
  var v = document.getElementById('adminCode').value.trim();
  if(v === ADMIN_CODE){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    load();
  }else{
    document.getElementById('gateErr').style.display = 'block';
    document.getElementById('adminCode').value = '';
    document.getElementById('gateBtn').disabled = true;
  }
}

function load(){
  var el = document.getElementById('list');
  el.innerHTML = '<div class="loading">加载中...</div>';
  fetch(URL + '?select=*&code=eq.' + encodeURIComponent(ADMIN_CODE) + '&order=created_at.desc', {
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  }).then(function(r){ return r.json(); }).then(function(data){
    if (!data || data.length === 0) {
      el.innerHTML = '<div class="empty">还没有收到回应 💌<br><br>把邀请链接发给对方吧~</div>';
      return;
    }
    el.innerHTML = data.map(function(row, i){
      return '<div class="card">' +
        '<button class="del-btn" onclick="delRow(' + row.id + ')" title="删除">🗑</button>' +
        '<div class="no">#' + (data.length - i) + ' · ' + timeAgo(row.created_at) + '</div>' +
        '<div class="detail">' +
        '🍽️ <strong>' + esc(row.food) + '</strong> · 📍 <strong>' + esc(row.location) + '</strong><br>' +
        '📅 <strong>' + esc(row.date) + '</strong> · 🕐 <strong>' + esc(row.time||'未填') + '</strong>' +
        '</div>' +
        (row.message ? '<div class="msg">💬 ' + esc(row.message) + '</div>' : '') +
        '</div>';
    }).join('');
  }).catch(function(e){
    el.innerHTML = '<div class="empty">加载失败<br><br>请检查网络后刷新</div>';
  });
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// load only after code verification
</script>
</body>
</html>
